<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alquimia Digital — Painel Administrativo</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(124, 58, 237, .2), transparent 35%),
        #0b1120;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      color: #60a5fa;
      margin-bottom: 8px;
    }

    .logo p {
      color: #94a3b8;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .form-group input:focus {
      border-color: #3b82f6;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #f87171;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      background: #111827;
      border-bottom: 1px solid #263244;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-brand h1 {
      font-size: 20px;
      color: #60a5fa;
    }

    .admin-badge {
      font-size: 11px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 5px 9px;
      border-radius: 20px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }

    .refresh-btn {
      background: #1e40af;
    }

    .logout-btn {
      background: #7f1d1d;
    }

    .main {
      padding: 30px;
      max-width: 1400px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #94a3b8;
    }

    /* STATS */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 15px;
      padding: 22px;
    }

    .stat-card .label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: bold;
    }

    .blue {
      color: #60a5fa;
    }

    .yellow {
      color: #facc15;
    }

    .green {
      color: #4ade80;
    }

    .purple {
      color: #c084fc;
    }

    /* ORDERS */

    .section {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 15px;
      overflow: hidden;
    }

    .section-header {
      padding: 20px 22px;
      border-bottom: 1px solid #263244;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-header h3 {
      font-size: 19px;
    }

    .orders-count {
      color: #94a3b8;
      font-size: 13px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      text-align: left;
      padding: 15px;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid #263244;
      background: #0f172a;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }

    tr:hover {
      background: #172033;
    }

    .customer-name {
      font-weight: bold;
      color: white;
    }

    .customer-email {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(234,179,8,.15);
      color: #facc15;
    }

    .status-paid {
      background: rgba(34,197,94,.15);
      color: #4ade80;
    }

    .status-cancelled {
      background: rgba(239,68,68,.15);
      color: #f87171;
    }

    .status-other {
      background: rgba(148,163,184,.15);
      color: #cbd5e1;
    }

    .empty {
      padding: 50px;
      text-align: center;
      color: #64748b;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
    }

    .error {
      padding: 25px;
      text-align: center;
      color: #f87171;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 15px;
      }

      .topbar-brand h1 {
        font-size: 16px;
      }

      .admin-badge {
        display: none;
      }

      .topbar-actions .btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .main {
        padding: 20px 15px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat-card .value {
        font-size: 24px;
      }

      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginPage">

    <div class="login-box">

      <div class="logo">
        <h1>Alquimia Digital</h1>
        <p>Painel Administrativo</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="Digite o seu e-mail"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Palavra-passe</label>

          <input
            type="password"
            id="password"
            placeholder="Digite a sua palavra-passe"
            required
          >
        </div>

        <button type="submit" class="login-btn">
          Entrar no painel
        </button>

        <div id="loginMessage"></div>

      </form>

    </div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <div id="dashboard" class="hidden">

    <header class="topbar">

      <div class="topbar-brand">
        <h1>Alquimia Digital</h1>
        <span class="admin-badge">ADMIN</span>
      </div>

      <div class="topbar-actions">

        <button
          class="btn refresh-btn"
          id="refreshBtn"
        >
          Atualizar
        </button>

        <button
          class="btn logout-btn"
          id="logoutBtn"
        >
          Sair
        </button>

      </div>

    </header>


    <main class="main">

      <div class="welcome">

        <h2>Dashboard</h2>

        <p>
          Acompanhe as vendas e pedidos realizados no seu site.
        </p>

      </div>


      <!-- ESTATÍSTICAS -->

      <div class="stats-grid">

        <div class="stat-card">

          <div class="label">
            Total de pedidos
          </div>

          <div
            class="value blue"
            id="totalOrders"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="label">
            Pedidos pendentes
          </div>

          <div
            class="value yellow"
            id="pendingOrders"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="label">
            Pedidos pagos
          </div>

          <div
            class="value green"
            id="paidOrders"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="label">
            Receita total
          </div>

          <div
            class="value purple"
            id="totalRevenue"
          >
            0 MT
          </div>

        </div>

      </div>


      <!-- PEDIDOS -->

      <section class="section">

        <div class="section-header">

          <h3>Pedidos recentes</h3>

          <span
            class="orders-count"
            id="ordersCount"
          >
            0 pedidos
          </span>

        </div>


        <div
          id="ordersContainer"
          class="table-container"
        >

          <div class="loading">
            A carregar pedidos...
          </div>

        </div>

      </section>

    </main>

  </div>


  <script>

    /* =========================================
       CONFIGURAÇÃO SUPABASE
    ========================================= */

    const supabaseUrl = window.SUPABASE_URL;
    const supabaseKey = window.SUPABASE_KEY;

    if (!supabaseUrl || !supabaseKey) {

      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#0b1120;
          color:white;
          font-family:Arial;
          padding:20px;
          text-align:center;
        ">
          <div>
            <h2 style="color:#f87171;margin-bottom:15px;">
              Erro de configuração
            </h2>

            <p style="color:#94a3b8;">
              Não foi possível encontrar o SUPABASE_URL ou SUPABASE_KEY.
            </p>

            <p style="color:#94a3b8;margin-top:10px;">
              Verifique o arquivo config.js.
            </p>
          </div>
        </div>
      `;

      throw new Error("Configuração do Supabase não encontrada.");

    }


    const supabaseClient = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );


    /* =========================================
       ELEMENTOS
    ========================================= */

    const loginPage = document.getElementById("loginPage");
    const dashboard = document.getElementById("dashboard");

    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");

    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    const totalOrdersElement =
      document.getElementById("totalOrders");

    const pendingOrdersElement =
      document.getElementById("pendingOrders");

    const paidOrdersElement =
      document.getElementById("paidOrders");

    const totalRevenueElement =
      document.getElementById("totalRevenue");

    const ordersContainer =
      document.getElementById("ordersContainer");

    const ordersCount =
      document.getElementById("ordersCount");


    /* =========================================
       FORMATAR MOEDA
    ========================================= */

    function formatPrice(value) {

      const number = Number(value || 0);

      return number.toLocaleString("pt-MZ", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " MT";

    }


    /* =========================================
       ESCAPAR HTML
    ========================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       DATA
    ========================================= */

    function formatDate(dateValue) {

      if (!dateValue) {
        return "-";
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return date.toLocaleString("pt-MZ", {
        dateStyle: "short",
        timeStyle: "short"
      });

    }


    /* =========================================
       STATUS
    ========================================= */

    function getStatusClass(status) {

      const value = String(status || "").toLowerCase();

      if (
        value === "pending" ||
        value === "pendente"
      ) {
        return "status-pending";
      }

      if (
        value === "paid" ||
        value === "pago"
      ) {
        return "status-paid";
      }

      if (
        value === "cancelled" ||
        value === "cancelado"
      ) {
        return "status-cancelled";
      }

      return "status-other";

    }


    function getStatusText(status) {

      const value = String(status || "").toLowerCase();

      if (value === "pending") {
        return "Pendente";
      }

      if (value === "paid") {
        return "Pago";
      }

      if (value === "cancelled") {
        return "Cancelado";
      }

      return status || "Sem status";

    }


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      loginMessage.textContent = "A entrar...";
      loginMessage.style.color = "#94a3b8";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        console.error(error);

        loginMessage.textContent =
          "E-mail ou palavra-passe incorretos.";

        loginMessage.style.color = "#f87171";

        return;
      }


      if (data && data.session) {

        showDashboard();

      }

    });


    /* =========================================
       MOSTRAR DASHBOARD
    ========================================= */

    function showDashboard() {

      loginPage.classList.add("hidden");

      dashboard.classList.remove("hidden");

      loadDashboard();

    }


    /* =========================================
       MOSTRAR LOGIN
    ========================================= */

    function showLogin() {

      dashboard.classList.add("hidden");

      loginPage.classList.remove("hidden");

    }


    /* =========================================
       VERIFICAR SESSÃO
    ========================================= */

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {

        showDashboard();

      } else {

        showLogin();

      }

    }


    /* =========================================
       CARREGAR DASHBOARD
    ========================================= */

    async function loadDashboard() {

      ordersContainer.innerHTML = `
        <div class="loading">
          A carregar pedidos...
        </div>
      `;


      const {
        data: orders,
        error
      } = await supabaseClient
        .from("orders")
        .select(`
          id,
          product,
          customer_name,
          customer_email,
          quantity,
          total,
          status,
          created_at
        `)
        .order("created_at", {
          ascending: false
        });


      if (error) {

        console.error(error);

        ordersContainer.innerHTML = `
          <div class="error">
            Não foi possível carregar os pedidos.
            <br><br>
            Verifique as permissões da tabela orders no Supabase.
          </div>
        `;

        return;
      }


      const orderList = orders || [];


      /* ESTATÍSTICAS */

      const totalOrders = orderList.length;


      const pendingOrders =
        orderList.filter(order => {

          const status =
            String(order.status || "").toLowerCase();

          return (
            status === "pending" ||
            status === "pendente"
          );

        }).length;


      const paidOrders =
        orderList.filter(order => {

          const status =
            String(order.status || "").toLowerCase();

          return (
            status === "paid" ||
            status === "pago"
          );

        }).length;


      const totalRevenue =
        orderList.reduce((sum, order) => {

          const status =
            String(order.status || "").toLowerCase();

          /*
            Aqui contamos como receita
            todos os pedidos registrados.
          */

          return sum + Number(order.total || 0);

        }, 0);


      totalOrdersElement.textContent =
        totalOrders;

      pendingOrdersElement.textContent =
        pendingOrders;

      paidOrdersElement.textContent =
        paidOrders;

      totalRevenueElement.textContent =
        formatPrice(totalRevenue);


      ordersCount.textContent =
        `${totalOrders} ${
          totalOrders === 1 ? "pedido" : "pedidos"
        }`;


      /* TABELA */

      if (orderList.length === 0) {

        ordersContainer.innerHTML = `
          <div class="empty">
            Ainda não existem pedidos.
          </div>
        `;

        return;
      }


      /* PRODUTOS */

      const productIds = [
        ...new Set(
          orderList
            .map(order => order.product)
            .filter(Boolean)
        )
      ];


      let productsMap = {};


      if (productIds.length > 0) {

        const {
          data: products,
          error: productsError
        } = await supabaseClient
          .from("products")
          .select("id,name")
          .in("id", productIds);


        if (!productsError && products) {

          products.forEach(product => {

            productsMap[product.id] =
              product.name;

          });

        }

      }


      /* CONSTRUIR TABELA */

      let html = `

        <table>

          <thead>

            <tr>

              <th>Cliente</th>

              <th>Produto</th>

              <th>Quantidade</th>

              <th>Total</th>

              <th>Status</th>

              <th>Data</th>

            </tr>

          </thead>

          <tbody>
      `;


      orderList.forEach(order => {

        const productName =
          productsMap[order.product] ||
          "Produto";


        const statusClass =
          getStatusClass(order.status);


        const statusText =
          getStatusText(order.status);


        html += `

          <tr>

            <td>

              <div class="customer-name">
                ${escapeHTML(order.customer_name)}
              </div>

              <div class="customer-email">
                ${escapeHTML(order.customer_email)}
              </div>

            </td>


            <td>
              ${escapeHTML(productName)}
            </td>


            <td>
              ${Number(order.quantity || 0)}
            </td>


            <td>
              <strong>
                ${formatPrice(order.total)}
              </strong>
            </td>


            <td>

              <span class="status ${statusClass}">
                ${escapeHTML(statusText)}
              </span>

            </td>


            <td>
              ${formatDate(order.created_at)}
            </td>

          </tr>

        `;

      });


      html += `

          </tbody>

        </table>

      `;


      ordersContainer.innerHTML = html;

    }


    /* =========================================
       ATUALIZAR
    ========================================= */

    refreshBtn.addEventListener(
      "click",
      loadDashboard
    );


    /* =========================================
       LOGOUT
    ========================================= */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        showLogin();

      }
    );


    /* =========================================
       ALTERAÇÃO DE AUTENTICAÇÃO
    ========================================= */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        if (session) {

          showDashboard();

        } else {

          showLogin();

        }

      }
    );


    /* =========================================
       INICIAR
    ========================================= */

    checkSession();

  </script>

</body>
</html>
